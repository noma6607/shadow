<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2430">
<title>섀도잉 녹음</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1d2129; --sub:#6b7280; --line:#e3e6ea;
    --rec:#e5383b; --rec-soft:#fde8e8; --ok:#2f855a; --accent:#3b5bdb;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14161b; --card:#1d2027; --ink:#eef0f3; --sub:#9aa3af; --line:#2c313a; --rec-soft:#3a1d1f; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit}

  /* ── 메인 막대: 작은 창에서도 이 한 줄만 보이면 됨 ── */
  #bar{display:flex;align-items:center;gap:10px;padding:8px 10px;min-height:72px}
  #recBtn{flex:0 0 auto;width:60px;height:60px;border-radius:50%;border:none;
    background:var(--rec);display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.18)}
  #recBtn .dot{width:22px;height:22px;border-radius:50%;background:#fff}
  #recBtn.on{background:#2b2f38}
  #recBtn.on .dot{border-radius:4px;background:var(--rec);width:20px;height:20px}
  #recBtn:disabled{opacity:.5}
  #info{flex:1 1 auto;min-width:0}
  #lbl{font-size:min(.8rem,3.6vw);color:var(--sub);font-weight:600;white-space:nowrap;line-height:1.2}
  #total{font-size:min(1.9rem,8.5vw);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
  #status{font-size:min(.85rem,3.8vw);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.15rem}
  #status.live{color:var(--rec);font-weight:600}
  #status.warn{color:#b7791f}
  #menuBtn{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);font-size:22px;line-height:1;cursor:pointer}
  body.recording{background:var(--rec-soft)}

  /* ── 전체를 덮는 패널(메뉴/목록/인증 화면) ── */
  .sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;display:none;z-index:10;
    padding:.75rem .75rem 2rem}
  .sheet.show{display:block}
  .sheetHead{display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem}
  .sheetHead h2{font-size:1.1rem;margin:0;flex:1;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
  .row{flex-wrap:wrap}
  .row .more{display:none;flex-basis:100%;justify-content:flex-end;gap:.5rem;padding-top:.4rem}
  .row.open .more{display:flex}
  .row .more button{padding:.5rem .9rem;border-radius:.6rem;border:1px solid #e9b4b4;background:transparent;color:#c0392b;font-size:.95rem;cursor:pointer}
  .x{width:2.5rem;height:2.5rem;border-radius:.6rem;border:1px solid var(--line);background:var(--card);font-size:1.1rem;cursor:pointer;flex:0 0 auto}
  .item{display:block;width:100%;text-align:left;padding:.85rem 1rem;margin-bottom:.5rem;border-radius:.8rem;
    border:1px solid var(--line);background:var(--card);font-size:1rem;cursor:pointer}
  .item .r{float:right;color:var(--sub);font-size:.9rem}
  .row{display:flex;align-items:center;gap:.5rem;padding:.65rem .75rem;margin-bottom:.45rem;border-radius:.7rem;
    border:1px solid var(--line);background:var(--card)}
  .row .t{flex:1;min-width:0;font-variant-numeric:tabular-nums}
  .row .t b{font-size:1rem}
  .row .t span{display:block;font-size:.8rem;color:var(--sub)}
  .ib{flex:0 0 auto;width:2.5rem;height:2.5rem;border-radius:.6rem;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1rem}
  .muted{color:var(--sub);font-size:.9rem}
  .big{display:block;width:100%;padding:.95rem;border-radius:.85rem;border:none;font-size:1.05rem;font-weight:700;cursor:pointer;margin-bottom:.55rem}
  .primary{background:var(--accent);color:#fff}
  .plain{background:var(--card);border:1px solid var(--line)}
  .danger{background:transparent;border:1px solid #e9b4b4;color:#c0392b}

  /* 인증 카드: 이 화면을 캡처 */
  #certCard{background:var(--card);border:1px solid var(--line);border-radius:1.1rem;padding:1.4rem 1rem;text-align:center;margin-bottom:1rem}
  #certCard .d{font-size:1rem;color:var(--sub)}
  #certCard .lbl{font-size:1rem;margin-top:.6rem;font-weight:600}
  #certCard .tt{font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;margin:.2rem 0}
  #certCard .n{font-size:.9rem;color:var(--sub)}
  #progress{height:.5rem;border-radius:.25rem;background:var(--line);overflow:hidden;margin:.6rem 0}
  #progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  #certMsg{font-size:.9rem;color:var(--sub);text-align:center;margin-bottom:.6rem;min-height:1.2em}
  #toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:#2b2f38;color:#fff;padding:.55rem .9rem;
    border-radius:.6rem;font-size:.9rem;display:none;z-index:50;max-width:90%;text-align:center}
</style>
</head>
<body>

<div id="bar">
  <button id="recBtn" aria-label="녹음"><span class="dot"></span></button>
  <div id="info">
    <div id="lbl">오늘 누적</div>
    <div id="total"><span id="totalTxt">0:00</span></div>
    <div id="status">대기 중</div>
  </div>
  <button id="menuBtn" aria-label="메뉴">⋮</button>
</div>

<!-- 메뉴 -->
<div class="sheet" id="menuSheet">
  <div class="sheetHead"><h2>섀도잉 녹음</h2><button class="x" data-close>✕</button></div>
  <button class="item" id="mShare">📤 오늘 녹음 합쳐서 공유</button>
  <button class="item" id="mPieces">🎧 오늘 녹음 조각 <span class="r" id="mPiecesN"></span></button>
  <button class="item" id="mDays">📅 지난 날짜</button>
  <div class="muted" style="margin-top:1rem">v1</div>
</div>

<!-- 하루 조각 목록 -->
<div class="sheet" id="daySheet">
  <div class="sheetHead"><h2 id="dayTitle"></h2><button class="x" data-close>✕</button></div>
  <button class="big primary" id="dayShareBtn">📤 합쳐서 공유</button>
  <div id="dayList"></div>
  <button class="big danger" id="dayDeleteAll" style="margin-top:1rem">이 날 녹음 전부 삭제</button>
</div>

<!-- 지난 날짜 -->
<div class="sheet" id="daysSheet">
  <div class="sheetHead"><h2>지난 날짜</h2><button class="x" data-close>✕</button></div>
  <div id="daysList"></div>
</div>

<!-- 합치기 / 인증 화면 -->
<div class="sheet" id="certSheet">
  <div class="sheetHead"><h2>인증</h2><button class="x" data-close>✕</button></div>
  <div id="certCard">
    <div class="d" id="certDate"></div>
    <div class="lbl">🎙 섀도잉 녹음</div>
    <div class="tt" id="certTotal">0:00</div>
    <div class="n" id="certN"></div>
  </div>
  <div id="progress"><i></i></div>
  <div id="certMsg"></div>
  <button class="big primary" id="certShare" disabled>📤 공유하기</button>
  <button class="big plain" id="certPlay" disabled>▶ 들어보기</button>
  <button class="big plain" id="certSave" disabled>💾 파일로 저장</button>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ================= 저장소(IndexedDB) =================
   pieces : 녹음 조각 1개 = { id, day:'YYYY-MM-DD', startedAt, durMs, mime, blob, done }
   chunks : 녹음 중에 3초마다 쌓는 임시 조각 { pieceId, seq, blob }  → 앱이 갑자기 꺼져도 여기까지는 살림
   merged : 날짜별 합친 파일 캐시 { day, sig, blob, name, durMs } */
const DB_NAME = "shadowRec", DB_VER = 1;
let dbp = null;
function db() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains("pieces")) { const s = d.createObjectStore("pieces", { keyPath: "id" }); s.createIndex("day", "day"); }
      if (!d.objectStoreNames.contains("chunks")) { const s = d.createObjectStore("chunks", { keyPath: ["pieceId", "seq"] }); s.createIndex("pieceId", "pieceId"); }
      if (!d.objectStoreNames.contains("merged")) d.createObjectStore("merged", { keyPath: "day" });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
function tx(store, mode, fn) {
  return db().then(d => new Promise((res, rej) => {
    const t = d.transaction(store, mode); let out;
    Promise.resolve(fn(t.objectStore(store), t)).then(v => { out = v; });
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const putPiece = p => tx("pieces", "readwrite", s => { s.put(p); });
const getPiece = id => tx("pieces", "readonly", s => req(s.get(id)));
const piecesOfDay = day => tx("pieces", "readonly", s => req(s.index("day").getAll(day))).then(a => a.sort((x, y) => x.startedAt - y.startedAt));
const allPieces = () => tx("pieces", "readonly", s => req(s.getAll()));
const putChunk = c => tx("chunks", "readwrite", s => { s.put(c); });
const chunksOf = id => tx("chunks", "readonly", s => req(s.index("pieceId").getAll(id))).then(a => a.sort((x, y) => x.seq - y.seq));
function delChunks(id) {
  return tx("chunks", "readwrite", s => req(s.index("pieceId").getAllKeys(id)).then(keys => keys.forEach(k => s.delete(k))));
}
const delPiece = id => tx("pieces", "readwrite", s => { s.delete(id); }).then(() => delChunks(id));
const getMerged = day => tx("merged", "readonly", s => req(s.get(day)));
const putMerged = m => tx("merged", "readwrite", s => { s.put(m); });
const delMerged = day => tx("merged", "readwrite", s => { s.delete(day); });

/* ================= 날짜/시간 ================= */
const pad = n => String(n).padStart(2, "0");
function dayKey(t) { const d = new Date(t); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function fmt(ms) {
  const s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return h ? h + ":" + pad(m) + ":" + pad(ss) : m + ":" + pad(ss);
}
function fmtKo(ms) {
  const s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return (h ? h + "시간" : "") + (h || m ? m + "분" : "") + ss + "초";
}
function fileDur(ms) { const s = Math.round(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + "h" : "") + m + "m" + pad(ss) + "s"; }
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function dayLabel(day) { const [y, m, d] = day.split("-").map(Number); const w = WD[new Date(y, m - 1, d).getDay()]; return y + "." + m + "." + d + " (" + w + ")"; }
function clock(t) { const d = new Date(t); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }

/* ================= 화면 ================= */
const $ = id => document.getElementById(id);
const recBtn = $("recBtn"), totalTxt = $("totalTxt"), statusEl = $("status");
function toast(t, ms) { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => el.style.display = "none", ms || 2500); }
function setStatus(t, cls) { statusEl.textContent = t; statusEl.className = cls || ""; }
function openSheet(id) { document.querySelectorAll(".sheet").forEach(s => s.classList.toggle("show", s.id === id)); }
function closeSheets() { document.querySelectorAll(".sheet").forEach(s => s.classList.remove("show")); stopPreview(); }
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeSheets));

/* ================= 녹음 ================= */
const SLICE_MS = 1000;          // 1초마다 임시 저장
const PIECE_MAX_MS = 5 * 60000;  // 5분마다 조각을 새로 시작(합칠 때 폰 메모리 부담 줄이기)
let stream = null, rec = null, cur = null, recording = false, wakeLock = null;
let todayDoneMs = 0, tickTimer = null;

function pickMime() {
  const c = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
  for (const m of c) if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
  return "";
}

async function refreshToday() {
  const list = await piecesOfDay(dayKey(Date.now()));
  todayDoneMs = list.filter(p => !cur || p.id !== cur.id).reduce((a, p) => a + (p.durMs || 0), 0);
  $("mPiecesN").textContent = list.length ? list.length + "개" : "";
  render();
}
function liveMs() { return cur ? Date.now() - cur.startedAt : 0; }
function render() {
  totalTxt.textContent = fmt(todayDoneMs + liveMs());
  if (recording && cur) setStatus("● 녹음 중 " + fmt(sessionMs()), "live");
}
let sessionStart = 0;
const sessionMs = () => Date.now() - sessionStart;

/* 조각 하나 시작: MediaRecorder를 새로 만들고 3초마다 chunk 저장 */
function startPiece() {
  const mime = pickMime();
  const r = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  const p = { id: "p" + Date.now() + Math.random().toString(36).slice(2, 6), day: dayKey(Date.now()), startedAt: Date.now(), durMs: 0, mime: r.mimeType || mime || "audio/webm", blob: null, done: false };
  let seq = 0; const writes = [];
  r.ondataavailable = e => {
    if (!e.data || !e.data.size) return;
    const c = { pieceId: p.id, seq: seq++, blob: e.data };
    p.durMs = Date.now() - p.startedAt;
    writes.push(putChunk(c).then(() => putPiece({ ...p, blob: null })).catch(err => console.warn(err)));
  };
  r._piece = p; r._writes = writes;
  r.start(SLICE_MS);
  return { r, p };
}
/* 조각 마무리: 임시 chunk들을 파일 1개로 묶어 저장 */
function finishPiece(r) {
  return new Promise(res => {
    const p = r._piece;
    r.onstop = async () => {
      p.durMs = Date.now() - p.startedAt;
      try { await Promise.all(r._writes); } catch (e) {}
      await finalizePiece(p.id, p.durMs);
      res();
    };
    try { r.state !== "inactive" ? r.stop() : r.onstop(); } catch (e) { r.onstop(); }
  });
}
async function finalizePiece(id, durMs) {
  const p = await getPiece(id); if (!p) return;
  const cs = await chunksOf(id);
  if (!cs.length) { await delPiece(id); return; }
  p.blob = new Blob(cs.map(c => c.blob), { type: p.mime });
  if (durMs) p.durMs = durMs;
  p.done = true;
  await putPiece(p); await delChunks(id); await delMerged(p.day);
}

async function startRecording() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    setStatus("이 화면에선 녹음이 안 돼", "warn"); toast("이 브라우저에선 마이크를 쓸 수 없어. 크롬으로 열어줘.", 4000); return;
  }
  recBtn.disabled = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
  } catch (e) {
    recBtn.disabled = false;
    setStatus("마이크가 허용되지 않았어", "warn");
    toast("주소창 왼쪽 아이콘 → 권한 → 마이크 허용을 눌러줘.", 4500);
    return;
  }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  stream.getAudioTracks().forEach(t => t.addEventListener("ended", () => { if (recording) stopRecording("끊김"); }));
  sessionStart = Date.now();
  const s = startPiece(); rec = s.r; cur = s.p;
  recording = true; recBtn.disabled = false; recBtn.classList.add("on"); recBtn.setAttribute("aria-label", "정지");
  document.body.classList.add("recording");
  await refreshToday();
  keepAwake();
  tickTimer = setInterval(tick, 500);
}
let rotating = false;
async function tick() {
  render();
  if (!recording || rotating || !cur) return;
  const needDay = dayKey(Date.now()) !== cur.day;           // 자정이 지나면 새 날짜로
  if (needDay || Date.now() - cur.startedAt >= PIECE_MAX_MS) {  // 5분이 지나면 새 조각
    rotating = true;
    const old = rec, s = startPiece();                           // 새 조각을 먼저 시작하고
    rec = s.r; cur = s.p;
    await finishPiece(old);                                      // 이전 조각을 닫음 → 끊김 없이 이어짐
    await refreshToday();
    rotating = false;
  }
}
async function stopRecording(why) {
  if (!recording) return;
  recording = false; recBtn.disabled = true;
  clearInterval(tickTimer);
  while (rotating) await new Promise(r => setTimeout(r, 50));
  const r = rec; rec = null;
  if (r) await finishPiece(r);
  cur = null;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  releaseAwake();
  recBtn.disabled = false; recBtn.classList.remove("on"); recBtn.setAttribute("aria-label", "녹음");
  document.body.classList.remove("recording");
  await refreshToday();
  if (why === "끊김") { setStatus("녹음이 끊겼어 · 여기까지 저장됨", "warn"); toast("녹음이 끊겼어. 여기까지는 저장됐어.", 4000); }
  else setStatus("저장됨 · 누르면 이어서 녹음");
}
recBtn.addEventListener("click", () => recording ? stopRecording() : startRecording());

async function keepAwake() { try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {} }
function releaseAwake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { if (recording) keepAwake(); refreshToday(); } });
// 창을 닫거나 새로고침하기 직전: 지금까지 녹음된 부분을 바로 내보내도록 요청
window.addEventListener("pagehide", () => { try { rec && rec.state === "recording" && rec.requestData(); } catch (e) {} });

/* 앱이 갑자기 꺼졌던 조각 살리기 */
async function recoverOrphans() {
  const all = await allPieces();
  let n = 0;
  for (const p of all) if (!p.done) { await finalizePiece(p.id, p.durMs); n++; }
  if (n) toast("지난번에 갑자기 꺼진 녹음 " + n + "개를 살려서 저장했어.", 3500);
}

/* ================= 하루 조각 목록 ================= */
let viewDay = null, previewEl = null, previewUrl = null;
function stopPreview() {
  if (previewEl) { try { previewEl.pause(); } catch (e) {} previewEl = null; }
  if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
  document.querySelectorAll("[data-play]").forEach(b => b.textContent = "▶");
}
async function showDay(day) {
  viewDay = day;
  const list = (await piecesOfDay(day)).filter(p => p.done);
  const total = list.reduce((a, p) => a + p.durMs, 0);
  $("dayTitle").textContent = dayLabel(day) + " · " + fmt(total);
  const box = $("dayList"); box.innerHTML = "";
  if (!list.length) box.innerHTML = '<div class="muted">녹음이 없어.</div>';
  list.forEach((p, i) => {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = '<div class="t"><b>' + (i + 1) + '. ' + fmt(p.durMs) + '</b><span>' + clock(p.startedAt) + ' 시작</span></div>' +
      '<button class="ib" data-play="' + p.id + '" aria-label="듣기">▶</button><button class="ib" data-more aria-label="더보기">⋮</button>' +
      '<div class="more"><button data-del="' + p.id + '">🗑 이 조각 삭제</button></div>';
    box.appendChild(row);
  });
  $("dayShareBtn").disabled = !list.length; $("dayDeleteAll").style.display = list.length ? "" : "none";
  openSheet("daySheet");
}
$("dayList").addEventListener("click", async e => {
  const pb = e.target.closest("[data-play]"), db_ = e.target.closest("[data-del]"), mb = e.target.closest("[data-more]");
  if (mb) { mb.closest(".row").classList.toggle("open"); return; }
  if (pb) {
    const playing = pb.textContent === "⏸"; stopPreview(); if (playing) return;
    const p = await getPiece(pb.dataset.play); if (!p || !p.blob) return;
    previewUrl = URL.createObjectURL(p.blob); previewEl = new Audio(previewUrl);
    previewEl.onended = stopPreview; pb.textContent = "⏸";
    previewEl.play().catch(() => { stopPreview(); toast("재생이 안 돼."); });
  } else if (db_) {
    if (!confirm("이 조각을 삭제할까?")) return;
    stopPreview(); const p = await getPiece(db_.dataset.del);
    await delPiece(db_.dataset.del); if (p) await delMerged(p.day);
    await refreshToday(); showDay(viewDay);
  }
});
$("dayDeleteAll").addEventListener("click", async () => {
  if (!confirm(dayLabel(viewDay) + " 녹음을 전부 삭제할까?")) return;
  stopPreview();
  for (const p of await piecesOfDay(viewDay)) if (!(cur && p.id === cur.id)) await delPiece(p.id);
  await delMerged(viewDay); await refreshToday(); showDay(viewDay);
});
$("dayShareBtn").addEventListener("click", () => startMerge(viewDay));

/* 지난 날짜 */
async function showDays() {
  const all = (await allPieces()).filter(p => p.done);
  const by = {}; all.forEach(p => { (by[p.day] = by[p.day] || { n: 0, ms: 0 }); by[p.day].n++; by[p.day].ms += p.durMs; });
  const days = Object.keys(by).sort().reverse();
  const box = $("daysList"); box.innerHTML = "";
  if (!days.length) box.innerHTML = '<div class="muted">아직 녹음이 없어.</div>';
  days.forEach(d => {
    const b = document.createElement("button"); b.className = "item";
    b.innerHTML = dayLabel(d) + '<span class="r">' + fmt(by[d].ms) + ' · ' + by[d].n + '개</span>';
    b.onclick = () => showDay(d); box.appendChild(b);
  });
  openSheet("daysSheet");
}

$("menuBtn").addEventListener("click", () => { refreshToday(); openSheet("menuSheet"); });
$("mShare").addEventListener("click", () => startMerge(dayKey(Date.now())));
$("mPieces").addEventListener("click", () => showDay(dayKey(Date.now())));
$("mDays").addEventListener("click", showDays);

/* ================= 합치기 =================
   조각마다: 소리를 풀어서(decode) → 한 줄로 이어서 → 새 파일 1개로 만듦.
   폰 크롬이 AAC를 지원하면 .m4a(작음), 안 되면 .wav(용량 큼, 대신 어디서나 재생됨). */
const AAC_RATE = 44100, WAV_RATE = 16000;
async function canAac() {
  try { return typeof AudioEncoder !== "undefined" && (await AudioEncoder.isConfigSupported({ codec: "mp4a.40.2", sampleRate: AAC_RATE, numberOfChannels: 1, bitrate: 64000 })).supported; }
  catch (e) { return false; }
}
async function decodeMono(blob, rate) {
  const ab = await blob.arrayBuffer();
  const ctx = new OfflineAudioContext(1, 1, rate);
  const buf = await ctx.decodeAudioData(ab);
  if (buf.numberOfChannels === 1) return buf.getChannelData(0);
  const out = new Float32Array(buf.length), n = buf.numberOfChannels;
  for (let c = 0; c < n; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) out[i] += d[i] / n; }
  return out;
}

/* ---- MP4(m4a) 상자 만들기: AAC 프레임들을 m4a 파일로 포장 ---- */
function mp4Box(type, ...parts) {
  let len = 8; parts.forEach(p => len += p.length);
  const out = new Uint8Array(len), dv = new DataView(out.buffer);
  dv.setUint32(0, len); for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
  let o = 8; parts.forEach(p => { out.set(p, o); o += p.length; });
  return out;
}
function u8(...a) { return new Uint8Array(a); }
function u32(...vals) { const b = new Uint8Array(vals.length * 4), dv = new DataView(b.buffer); vals.forEach((v, i) => dv.setUint32(i * 4, v >>> 0)); return b; }
function u16(...vals) { const b = new Uint8Array(vals.length * 2), dv = new DataView(b.buffer); vals.forEach((v, i) => dv.setUint16(i * 2, v)); return b; }
function str(s) { return new Uint8Array([...s].map(c => c.charCodeAt(0))); }
function full(type, ver, flags, ...parts) { return mp4Box(type, u8(ver, (flags >> 16) & 255, (flags >> 8) & 255, flags & 255), ...parts); }
function buildM4a(frames, asc, rate, channels, bitrate) {
  const n = frames.length, frameLen = 1024;
  const durTicks = n * frameLen, durMs = Math.round(durTicks * 1000 / rate);
  const ftyp = mp4Box("ftyp", str("M4A "), u32(0), str("M4A "), str("isom"), str("mp42"));
  let dataLen = 0; frames.forEach(f => dataLen += f.length);
  const mdatHead = new Uint8Array(8); new DataView(mdatHead.buffer).setUint32(0, dataLen + 8); mdatHead.set(str("mdat"), 4);
  const dataOffset = ftyp.length + 8;
  const matrix = u32(0x00010000, 0, 0, 0, 0x00010000, 0, 0, 0, 0x40000000);
  const mvhd = full("mvhd", 0, 0, u32(0, 0, 1000, durMs), u32(0x00010000), u16(0x0100), u16(0), u32(0, 0), matrix, u32(0, 0, 0, 0, 0, 0), u32(2));
  const tkhd = full("tkhd", 0, 7, u32(0, 0, 1, 0, durMs), u32(0, 0), u16(0, 0), u16(0x0100), u16(0), matrix, u32(0, 0));
  const mdhd = full("mdhd", 0, 0, u32(0, 0, rate, durTicks), u16(0x55c4), u16(0));
  const hdlr = full("hdlr", 0, 0, u32(0), str("soun"), u32(0, 0, 0), str("SoundHandler"), u8(0));
  const smhd = full("smhd", 0, 0, u16(0), u16(0));
  const dinf = mp4Box("dinf", full("dref", 0, 0, u32(1), full("url ", 0, 1)));
  // esds (AudioSpecificConfig 포함)
  const dsi = new Uint8Array([0x05, asc.length, ...asc]);
  const dcdBody = new Uint8Array([0x40, 0x15, 0, 0, 0, ...u32(bitrate), ...u32(bitrate), ...dsi]);
  const dcd = new Uint8Array([0x04, dcdBody.length, ...dcdBody]);
  const sl = u8(0x06, 0x01, 0x02);
  const esBody = new Uint8Array([0x00, 0x01, 0x00, ...dcd, ...sl]);
  const esds = full("esds", 0, 0, new Uint8Array([0x03, esBody.length, ...esBody]));
  const mp4a = mp4Box("mp4a", u8(0, 0, 0, 0, 0, 0), u16(1), u32(0, 0), u16(channels, 16), u16(0, 0), u32(rate * 65536), esds);
  const stsd = full("stsd", 0, 0, u32(1), mp4a);
  const stts = full("stts", 0, 0, u32(1, n, frameLen));
  const stsc = full("stsc", 0, 0, u32(1, 1, n, 1));
  const sizes = new Uint8Array(n * 4), sdv = new DataView(sizes.buffer); frames.forEach((f, i) => sdv.setUint32(i * 4, f.length));
  const stsz = full("stsz", 0, 0, u32(0, n), sizes);
  const stco = full("stco", 0, 0, u32(1, dataOffset));
  const stbl = mp4Box("stbl", stsd, stts, stsc, stsz, stco);
  const moov = mp4Box("moov", mvhd, mp4Box("trak", tkhd, mp4Box("mdia", mdhd, hdlr, mp4Box("minf", smhd, dinf, stbl))));
  return new Blob([ftyp, mdatHead, ...frames, moov], { type: "audio/mp4" });
}
function defaultAsc(rate, ch) {
  const idx = [96000, 88200, 64000, 48000, 44100, 32000, 24000, 22050, 16000, 12000, 11025, 8000].indexOf(rate);
  return new Uint8Array([(2 << 3) | (idx >> 1), ((idx & 1) << 7) | (ch << 3)]);
}

/* ---- WAV 만들기 ---- */
function wavHeader(dataBytes, rate) {
  const b = new ArrayBuffer(44), v = new DataView(b), w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + dataBytes, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, dataBytes, true);
  return new Uint8Array(b);
}
function toPcm16(f) { const o = new Int16Array(f.length); for (let i = 0; i < f.length; i++) { const s = Math.max(-1, Math.min(1, f[i])); o[i] = s < 0 ? s * 0x8000 : s * 0x7fff; } return o; }

let mergedFile = null, mergedUrl = null, certAudio = null, merging = false;
function setProgress(p) { document.querySelector("#progress i").style.width = Math.round(p * 100) + "%"; }

async function startMerge(day) {
  if (merging) return;
  if (recording && day === dayKey(Date.now())) await stopRecording();
  const list = (await piecesOfDay(day)).filter(p => p.done && p.blob);
  stopCertAudio(); mergedFile = null;
  ["certShare", "certPlay", "certSave"].forEach(id => $(id).disabled = true);
  $("certDate").textContent = dayLabel(day);
  $("certTotal").textContent = fmt(list.reduce((a, p) => a + p.durMs, 0));
  $("certN").textContent = list.length + "번 나눠서 녹음";
  setProgress(0); $("progress").style.display = "";
  openSheet("certSheet");
  if (!list.length) { $("certMsg").textContent = "이 날은 녹음이 없어."; $("progress").style.display = "none"; return; }

  const sig = list.map(p => p.id + ":" + p.durMs).join("|");
  const cached = await getMerged(day);
  if (cached && cached.sig === sig && cached.blob) { showMerged(cached); return; }

  merging = true;
  $("certMsg").textContent = "합치는 중… 화면을 켜 둬";
  try {
    const out = (await canAac()) ? await mergeAac(list) : await mergeWav(list);
    const name = "shadowing_" + day + "_" + fileDur(out.durMs) + out.ext;
    const m = { day, sig, blob: out.blob, name, durMs: out.durMs };
    await putMerged(m);
    showMerged(m);
  } catch (e) {
    console.error(e);
    $("certMsg").textContent = "합치다가 문제가 생겼어: " + (e && e.message || e);
  } finally { merging = false; }
}
async function mergeAac(list) {
  const frames = []; let asc = null, err = null, total = 0;
  const enc = new AudioEncoder({
    output: (chunk, meta) => {
      if (meta && meta.decoderConfig && meta.decoderConfig.description && !asc) asc = new Uint8Array(meta.decoderConfig.description);
      const b = new Uint8Array(chunk.byteLength); chunk.copyTo(b); frames.push(b);
    },
    error: e => { err = e; }
  });
  enc.configure({ codec: "mp4a.40.2", sampleRate: AAC_RATE, numberOfChannels: 1, bitrate: 64000 });
  let ts = 0;
  for (let i = 0; i < list.length; i++) {
    const pcm = await decodeMono(list[i].blob, AAC_RATE);
    const step = AAC_RATE; // 1초씩 넣기
    for (let o = 0; o < pcm.length; o += step) {
      const part = pcm.subarray(o, Math.min(pcm.length, o + step));
      const ad = new AudioData({ format: "f32-planar", sampleRate: AAC_RATE, numberOfFrames: part.length, numberOfChannels: 1, timestamp: Math.round(ts * 1e6 / AAC_RATE), data: part.slice() });
      enc.encode(ad); ad.close(); ts += part.length;
      while (enc.encodeQueueSize > 20) await new Promise(r => setTimeout(r, 5));
      if (err) throw err;
    }
    total += pcm.length;
    setProgress((i + 1) / list.length * 0.95);
    await new Promise(r => setTimeout(r, 0));
  }
  await enc.flush(); enc.close();
  if (err) throw err;
  if (!frames.length) throw new Error("소리가 비어 있어");
  const blob = buildM4a(frames, asc || defaultAsc(AAC_RATE, 1), AAC_RATE, 1, 64000);
  setProgress(1);
  return { blob, durMs: total * 1000 / AAC_RATE, ext: ".m4a" };
}
async function mergeWav(list) {
  const parts = []; let bytes = 0, total = 0;
  for (let i = 0; i < list.length; i++) {
    const pcm = toPcm16(await decodeMono(list[i].blob, WAV_RATE));
    parts.push(pcm); bytes += pcm.byteLength; total += pcm.length;
    setProgress((i + 1) / list.length);
    await new Promise(r => setTimeout(r, 0));
  }
  return { blob: new Blob([wavHeader(bytes, WAV_RATE), ...parts], { type: "audio/wav" }), durMs: total * 1000 / WAV_RATE, ext: ".wav" };
}
function showMerged(m) {
  mergedFile = new File([m.blob], m.name, { type: m.blob.type });
  $("certTotal").textContent = fmt(m.durMs);
  setProgress(1); $("progress").style.display = "none";
  const mb = (m.blob.size / 1048576).toFixed(1);
  $("certMsg").textContent = "✅ 파일 1개 완성 · " + mb + "MB";
  ["certShare", "certPlay", "certSave"].forEach(id => $(id).disabled = false);
}
function stopCertAudio() { if (certAudio) { try { certAudio.pause(); } catch (e) {} certAudio = null; } if (mergedUrl) { URL.revokeObjectURL(mergedUrl); mergedUrl = null; } $("certPlay").textContent = "▶ 들어보기"; }
$("certPlay").addEventListener("click", () => {
  if (!mergedFile) return;
  if (certAudio) { stopCertAudio(); return; }
  mergedUrl = URL.createObjectURL(mergedFile); certAudio = new Audio(mergedUrl);
  certAudio.onended = stopCertAudio; $("certPlay").textContent = "⏸ 멈춤";
  certAudio.play().catch(() => { stopCertAudio(); toast("재생이 안 돼."); });
});
function saveFile() {
  const u = URL.createObjectURL(mergedFile), a = document.createElement("a");
  a.href = u; a.download = mergedFile.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}
$("certSave").addEventListener("click", () => { if (mergedFile) saveFile(); });
$("certShare").addEventListener("click", async () => {
  if (!mergedFile) return;
  if (navigator.canShare && navigator.canShare({ files: [mergedFile] })) {
    try { await navigator.share({ files: [mergedFile], title: mergedFile.name }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  toast("공유창이 안 열려서 파일로 저장할게."); saveFile();
});
document.querySelectorAll("#certSheet [data-close]").forEach(b => b.addEventListener("click", stopCertAudio));

/* ================= 시작 ================= */
(async () => {
  try { await recoverOrphans(); } catch (e) { console.warn(e); }
  await refreshToday();
  setStatus(todayDoneMs ? "누르면 이어서 녹음" : "대기 중");
  setInterval(() => { if (!recording) refreshToday(); }, 30000); // 자정 넘으면 '오늘'이 새 날짜로 바뀜
})();
</script>
